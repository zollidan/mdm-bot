version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mdm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./mdm.db:/app/mdm.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - mdm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mdm-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mdm-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: mdm-bot
    env_file:
      - .env
    environment:
      - WEBAPP_URL=${WEBAPP_URL:-http://localhost:5173}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - mdm-network

networks:
  mdm-network:
    driver: bridge
